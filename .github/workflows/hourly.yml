name: Hourly Feature + Inference Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour
  workflow_dispatch: {}     # allows manual trigger from GitHub UI

concurrency:
  group: hourly-pipeline
  cancel-in-progress: false 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-general.txt

      - name: Run feature pipeline (hourly mode)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python code/features.py --mode hourly

      - name: Run inference
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python code/inferance.py

      - name: Commit updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/latest_forecast.csv
          git diff --staged --quiet || git commit -m "Update forecast [automated]"
          git pull --rebase origin main
          git push